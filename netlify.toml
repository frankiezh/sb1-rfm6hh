[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Force HTTPS with explicit domain
[[redirects]]
  from = "http://polsterei-hb-zuerich.ch/*"
  to = "https://polsterei-hb-zuerich.ch/:splat"
  status = 301
  force = true

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  framework = "#auto"
  targetPort = 5173
  port = 8888
  publish = "dist"
  autoLaunch = true

# Form handling settings
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.forms]
  enabled = true

[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
    [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"