<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your App Title</title>

    <!-- Default Consent State - MUST be before GTM -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Check stored consent
      const storedConsent = localStorage.getItem('userConsent');
      let defaultConsent = {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_personalization': 'denied',
        'ad_user_data': 'denied'
      };

      if (storedConsent) {
        try {
          // Parse the stored consent only if it's an object
          const parsedConsent = JSON.parse(storedConsent);
          if (typeof parsedConsent === 'object' && parsedConsent !== null) {
            defaultConsent = parsedConsent;
          }
        } catch (e) {
          // If parsing fails, check if it's the string "granted"
          if (storedConsent === 'granted') {
            defaultConsent = {
              'ad_storage': 'granted',
              'analytics_storage': 'granted',
              'ad_personalization': 'granted',
              'ad_user_data': 'granted'
            };
          }
          // If it's neither valid JSON nor "granted", use default denied state
        }
      }
      
      // Set default consent state
      gtag('consent', 'default', defaultConsent);
    </script>
    
    <script type="module">
      import { initializeGTM } from '/src/lib/gtm.js';
      initializeGTM();
    </script>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N9C4C7MB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <div id="root"></div>
    <!-- Netlify Form -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
