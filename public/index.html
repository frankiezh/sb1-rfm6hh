<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your App Title</title>

    <!-- Default Consent State - MUST be before GTM -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Check stored consent
      let defaultConsent = {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_personalization': 'denied',
        'ad_user_data': 'denied'
      };

      try {
        const storedConsent = localStorage.getItem('userConsent');
        if (storedConsent) {
          const parsedConsent = JSON.parse(storedConsent);
          if (typeof parsedConsent === 'object' && parsedConsent !== null) {
            defaultConsent = parsedConsent;
          }
        }
      } catch (error) {
        console.error('Error parsing stored consent:', error);
      }
      
      // Set default consent state
      gtag('consent', 'default', defaultConsent);
    </script>
    
    <script type="module">
      import { initializeGTM } from '/src/lib/gtm.js';
      initializeGTM();
    </script>

    <!-- Canonical URL -->
    <link rel="canonical" href="https://polsterei-hb-zuerich.ch/" />

    <!-- Alternate Language Versions -->
    <link rel="alternate" hreflang="de" href="https://polsterei-hb-zuerich.ch/" />
    <link rel="alternate" hreflang="en" href="https://polsterei-hb-zuerich.ch/en/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:url" content="https://polsterei-hb-zuerich.ch/">

    <!-- Twitter -->
    <meta property="twitter:url" content="https://polsterei-hb-zuerich.ch/">
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-N9C4C7MB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <div id="root"></div>
    <!-- Netlify Form -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
